<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perc</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-additions.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>

  <!-- AUTH -->
  <div id="auth-container" class="auth-wrapper">
    <div class="glass-card auth-card">
      <div class="logo-area">
        <img id="logo-img" class="logo-image brand-logo" src="logo.png" alt="P" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';">
        <span class="logo-fallback-text" style="display:none;">P</span>
      </div>

      <div id="auth-toast" class="toast-notification hidden"></div>
      
      <form id="login-form" class="auth-form">
        <h2 class="form-title">login</h2>
        <div class="input-group">
          <input type="text" id="login-username" required placeholder=" ">
          <label for="login-username">username</label>
        </div>
        <div class="input-group">
          <input type="password" id="login-password" required placeholder=" ">
          <label for="login-password">password</label>
        </div>
        <button type="submit" class="btn btn-primary">sign in</button>
        <p class="toggle-text">no account? <a href="#" id="to-signup">register</a></p>
      </form>

      <form id="signup-form" class="auth-form hidden">
        <h2 class="form-title">register</h2>
        <div class="input-group">
          <input type="text" id="reg-username" required placeholder=" ">
          <label for="reg-username">username</label>
        </div>
        <div class="input-group">
          <input type="password" id="reg-password" required placeholder=" ">
          <label for="reg-password">password</label>
        </div>
        <div class="input-group">
          <input type="text" id="reg-license" required placeholder=" ">
          <label for="reg-license">license key</label>
        </div>
        <button type="submit" class="btn btn-primary">register</button>
        <p class="toggle-text">got an account? <a href="#" id="to-login">sign in</a></p>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-container" class="dashboard-wrapper hidden">
    <header class="navbar">
      <div class="nav-logo">
        <img id="nav-logo-img" class="logo-image nav-brand-logo" src="logo.png" alt="P" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';">
        <span class="logo-fallback-text" style="display:none; margin-right: 8px;">P</span>
      </div>
      <div class="nav-status">
        <div class="status-indicator">
          <span class="status-pulse green" id="status-dot"></span>
          <span class="status-label" id="status-text">ready</span>
        </div>
        <div class="session-info">
          <span id="user-display">guest</span>
          <button id="btn-logout" class="btn btn-secondary btn-small">logout</button>
        </div>
      </div>
    </header>

    <main class="dashboard-content">
      <!-- Config Editor -->
      <div class="glass-card editor-card">
        <div class="card-header">
          <h2>config</h2>
          <span id="save-status" class="save-status-text">draft</span>
        </div>
        
        <div id="phrase-display" class="floating-phrase"></div>
        <div class="editor-container">
          <textarea id="config-editor" spellcheck="false" placeholder="config..."></textarea>
        </div>

        <div class="control-footer">
          <div class="footer-left">
            <button id="btn-load" class="btn btn-secondary">load</button>
            <button id="btn-save" class="btn btn-accent">save</button>
          </div>
          <button id="btn-activate" class="btn btn-primary btn-large">activate</button>
        </div>
      </div>

      <!-- Get Script -->
      <div class="glass-card script-card">
        <div class="card-header">
          <h2>get script</h2>
          <span id="script-status" class="save-status-text">ready</span>
        </div>
        <p class="script-info-text">generates your loader script. connects to ws, loads your config from the site, then runs the main script.</p>
        <div class="key-display-area">
          <span class="key-label">key:</span>
          <span id="license-key-display" class="key-value">...</span>
          <button id="btn-copy-key" class="btn btn-secondary btn-small">copy</button>
        </div>
        <div class="script-actions">
          <button id="btn-get-script" class="btn btn-primary btn-large">get script</button>
          <button id="btn-copy-script" class="btn btn-accent btn-large hidden">copy script</button>
        </div>
        <div id="script-preview-area" class="hidden">
          <textarea id="script-preview" spellcheck="false" readonly></textarea>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="settings-modal hidden">
    <div class="glass-card settings-card">
      <div class="settings-header">
        <h3>settings</h3>
        <button id="btn-close-settings" class="btn-close">&times;</button>
      </div>
      <div class="settings-body" style="text-align: left;">
        <div class="input-group">
          <input type="text" id="setting-logo-url" placeholder=" ">
          <label for="setting-logo-url">logo url</label>
        </div>
        <p class="settings-hint">or put <code>logo.png</code> in the <code>public</code> folder.</p>
        <button id="btn-save-settings" class="btn btn-primary" style="width: 100%;">apply</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-area"></div>
  <script src="app.js"></script>
</body>
</html>
